<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>客服</title>
	<script>
		/**
		 * 原逻辑：kefu 页 web-view 打开本页并带 ?nickname=&username=
		 * 现改为跳转 Chat2Y「URL 对接」，参数映射见文档 userName / pid 等。
		 * 与线上一致：app.chat2y.cfd + channelId=7bca9329828549e9926b63862ceb22a5
		 */
		(function () {
			/* 与 frontend/utils/chat2y.js 中 CHAT2Y_INDEX / CHAT2Y_CHANNEL_ID 保持一致 */
			var CHAT_BASE = "https://app.dot01ax.cfd/chat/index";
			var CHANNEL_ID = "7bca9329828549e9926b63862ceb22a5";

			var search = window.location.search || "";
			var urlParams = new URLSearchParams(search);
			var nickname = urlParams.get("nickname") || "";
			var username = urlParams.get("username") || "";

			var q = new URLSearchParams();
			q.set("channelId", CHANNEL_ID);
			if (nickname) q.set("userName", nickname);
			if (username) q.set("pid", username);

			window.location.replace(CHAT_BASE + "?" + q.toString());
		})();
	</script>
</head>
<body></body>
</html>
