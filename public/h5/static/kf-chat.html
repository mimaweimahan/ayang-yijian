<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
	<title>Support</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
	</style>
</head>
<body>
	<script>
		/**
		 * 已废弃：请使用 utils/kf.js 的 buildKfChatUrl 直连 chat.html。
		 * 保留此页仅作兼容跳转。
		 */
		(function () {
			var SITE = 'https://skyscanner.ariainbox.cc';
			var APP_KEY = 'ak_breuaqlxzskngpl2';
			var params = new URLSearchParams(window.location.search || '');
			var q = new URLSearchParams();
			q.set('appKey', APP_KEY);
			q.set('lang', params.get('lang') || 'en');
			if (params.get('uid')) q.set('uid', params.get('uid'));
			if (params.get('nickname')) q.set('nickname', params.get('nickname'));
			window.location.replace(SITE + '/chat.html?' + q.toString());
		})();
	</script>
</body>
</html>
