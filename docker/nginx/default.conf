server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50m;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # 根路径直接提供 H5（内部 rewrite，不丢映射端口）
    location = / {
        rewrite ^ /h5/index.html last;
    }

    # H5 以 publicPath=/ 构建，静态资源在 /h5/static；保留后台 /static/admin
    location ^~ /static/admin/ {
        alias /var/www/html/public/static/admin/;
        expires 7d;
        access_log off;
    }
    location ^~ /static/ {
        alias /var/www/html/public/h5/static/;
        expires 7d;
        access_log off;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|runtime|composer\.(json|lock)|docker-compose|clean_db\.py|deploy_tenant\.sh) {
        deny all;
        return 404;
    }

    # ThinkPHP PATHINFO —— 禁止 try_files（会清空 $fastcgi_path_info）
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
