; 常驻 Worker：崩溃自动重启（task-worker 容器挂载此文件）
; 注意：worker 容器不要启动 nginx/php-fpm，仅跑本 program
[program:tenant-worker]
command=/bin/bash /usr/local/bin/worker-loop.sh
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=100
stopwaitsecs=20
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
