[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord-worker.log
pidfile=/var/run/supervisord-worker.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor-worker.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor-worker.sock

[include]
files = /etc/supervisor/conf.d/worker.conf
